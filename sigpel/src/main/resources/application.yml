spring:
  application:
    name: sigpel

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sigpel}
    username: ${DB_USERNAME:sigpel}
    password: ${DB_PASSWORD:sigpel}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Reemplazar con el issuer real del User Pool de Cognito, ej:
          # https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX
          issuer-uri: https://cognito-idp.${AWS_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:}

  # Limite un poco por encima de los 5MB que valida EquipmentService, para
  # que sea esa validacion (400 con mensaje claro) la que dispare primero,
  # y no MaxUploadSizeExceededException de Spring.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8080

aws:
  s3:
    bucket: ${S3_BUCKET_NAME:sigpel-equipos-imagenes-jpmora}
    region: ${AWS_REGION:us-east-1}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} | %-5level | ${spring.application.name} | sub=%X{sub:-anonimo} | %logger{40} | %msg%n"
  level:
    org.springframework.security: INFO
    com.puce.sigpel: DEBUG
    # SQL de cada peticion, con sus parametros (Criterio 2 - logging de BD).
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
