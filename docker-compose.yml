services:
  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-users}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users}
      POSTGRES_DB: ${USERS_DB_NAME:-users}
    expose:
      - "5432"
    volumes:
      - users_data:/var/lib/postgresql/data
    # Logging obligatorio (Criterio 2): registra cada sentencia SQL del motor,
    # con parametros y duracion. Forma de lista (no string): asi cada -c
    # queda como un argumento separado y "%m [%p] %u@%d app=%a" no se
    # rompe en varios argumentos por sus espacios.
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_duration=on
      - -c
      - log_min_duration_statement=0
      - -c
      - log_line_prefix=%m [%p] %u@%d app=%a
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-users} -d ${USERS_DB_NAME:-users}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sigpel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SIGPEL_DB_USER:-sigpel}
      POSTGRES_PASSWORD: ${SIGPEL_DB_PASSWORD:-sigpel}
      POSTGRES_DB: ${SIGPEL_DB_NAME:-sigpel}
    expose:
      - "5432"
    volumes:
      - sigpel_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_duration=on
      - -c
      - log_min_duration_statement=0
      - -c
      - log_line_prefix=%m [%p] %u@%d app=%a
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIGPEL_DB_USER:-sigpel} -d ${SIGPEL_DB_NAME:-sigpel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-microservice:
    build: ./users
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /users
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      DB_HOST: users-db
      DB_PORT: "5432"
      DB_NAME: ${USERS_DB_NAME:-users}
      DB_USERNAME: ${USERS_DB_USER:-users}
      DB_PASSWORD: ${USERS_DB_PASSWORD:-users}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?Set COGNITO_USER_POOL_ID in .env}
    expose:
      - "8686"
    depends_on:
      users-db:
        condition: service_healthy

  sigpel-microservice:
    build: ./sigpel
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /sigpel
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      DB_HOST: sigpel-db
      DB_PORT: "5432"
      DB_NAME: ${SIGPEL_DB_NAME:-sigpel}
      DB_USERNAME: ${SIGPEL_DB_USER:-sigpel}
      DB_PASSWORD: ${SIGPEL_DB_PASSWORD:-sigpel}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?Set COGNITO_USER_POOL_ID in .env}
      # Credenciales de S3 via IAM Role de la instancia EC2 (sigpel-ec2-s3-role),
      # no via variables de entorno.
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sigpel-equipos-imagenes-jpmora}
    expose:
      - "8080"
    depends_on:
      sigpel-db:
        condition: service_healthy
      # Dependencia entre microservicios: solo que haya arrancado, no que
      # este "sano" — un dominio no debe bloquear el arranque de otro.
      users-microservice:
        condition: service_started

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-9090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      users-microservice:
        condition: service_started
      sigpel-microservice:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sigpel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      users-db:
        condition: service_healthy
      sigpel-db:
        condition: service_healthy

volumes:
  users_data:
  sigpel_data:
  pgadmin_data:
